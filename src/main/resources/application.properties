server.port=8765
server.address=127.0.0.1

spring.datasource.url=jdbc:h2:file:./data/jobpilot
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Where generated resumes are stored
jobpilot.data-dir=./data

# Optional: Adzuna free API key (https://developer.adzuna.com) - covers many Indian job boards
jobpilot.adzuna.app-id=${ADZUNA_APP_ID:}
jobpilot.adzuna.app-key=${ADZUNA_APP_KEY:}
jobpilot.adzuna.country=in

# Optional AI drafts for free-text application questions (set ANTHROPIC_API_KEY to turn on)
jobpilot.ai.api-key=${ANTHROPIC_API_KEY:}
jobpilot.ai.model=claude-haiku-5-5

# Always re-check static files so the browser never shows an old version of the UI
spring.web.resources.cache.cachecontrol.no-cache=true
